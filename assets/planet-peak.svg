<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="peakTitle peakDesc">
  <title id="peakTitle">Peak Hunter</title>
  <desc id="peakDesc">A small rocky world in a painted galaxy, with one snowy mountain rising from it.</desc>
