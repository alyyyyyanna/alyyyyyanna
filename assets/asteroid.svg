<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="asteroidTitle asteroidDesc">
  <title id="asteroidTitle">A small asteroid</title>
  <desc id="asteroidDesc">A lumpy little world floating in a painted galaxy, with craters and one warm light.</desc>
  <defs>
    <filter id="edgeBlur" x="0" y="0" width="360" height="280" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="10"/></filter>
    <mask id="edgeFade" x="0" y="0" width="360" height="280" maskUnits="userSpaceOnUse"><rect x="30" y="30" width="300" height="220" rx="18" fill="#fff" filter="url(#edgeBlur)"/></mask>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2a2044"/>
      <stop offset="100%" stop-color="#090712"/>
    </radialGradient>
    <radialGradient id="rock" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e6d2b0"/>
      <stop offset="42%" stop-color="#a78462"/>
      <stop offset="100%" stop-color="#5a4032"/>
    </radialGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e7b4c4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e7b4c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g mask="url(#edgeFade)">
  <rect width="360" height="280" rx="18" fill="url(#space)"/>
  <ellipse cx="90" cy="70" rx="80" ry="36" fill="url(#pink)"/>
  <ellipse cx="260" cy="200" rx="90" ry="40" fill="#7d6bb8" opacity="0.22"/>
  <g fill="#fff6d8">
    <circle cx="40" cy="36" r="1.2"/><circle cx="300" cy="48" r="1"/><circle cx="48" cy="210" r="0.8"/>
    <circle cx="320" cy="150" r="1.1"/><circle cx="180" cy="28" r="0.7"/>
    <path d="M70 48 l1 3.2 3.4.1-2.6 2.1.9 3.2-2.7-2-2.7 2 .9-3.2-2.6-2.1 3.4-.1z"/>
  </g>
  <ellipse cx="188" cy="196" rx="78" ry="16" fill="#000" opacity="0.25"/>
  <path d="M108 150c6-48 46-78 96-72 34 4 62 8 78 42 16 36 4 74-34 92-42 20-92 18-118-14-22-26-28-28-22-48z" fill="url(#rock)" stroke="#f3e6d4" stroke-width="1.2"/>
  <ellipse cx="150" cy="128" rx="18" ry="12" fill="#6d4e3a" opacity="0.45"/>
  <ellipse cx="214" cy="156" rx="26" ry="16" fill="#6d4e3a" opacity="0.35"/>
  <ellipse cx="176" cy="112" rx="10" ry="7" fill="#6d4e3a" opacity="0.3"/>
  <ellipse cx="150" cy="118" rx="22" ry="10" fill="#fff6e8" opacity="0.28"/>
  <circle cx="196" cy="124" r="3.2" fill="#fff1c2"/>
  </g>
</svg>
