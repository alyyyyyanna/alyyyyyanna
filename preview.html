<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile preview</title>
  <style>
    body { margin: 0; background: #05040a; color: #f6efe4; font-family: Georgia, serif; }
    main { width: min(920px, 100%); margin: 0 auto; padding: 28px 0 80px; }
    img[width="100%"] { display: block; width: 100%; height: auto; }
    img[height="32"] { display: inline-block; width: auto; height: 32px; vertical-align: middle; }
    a { color: #f7f1e6; text-decoration: none; }
    .gap { height: 36px; }
    table { width: 100%; border-collapse: collapse; }
    td { vertical-align: top; padding: 0; }
  </style>
</head>
<body>
  <main>
    <table cellspacing="0" cellpadding="0">
<tr>
<td width="37%" align="center" valign="top">
<img src="assets/profile/header-portrait.svg" alt="" width="100%">
<a href="https://facebook.com/your-account"><img align="absmiddle" src="assets/profile/icons/facebook.svg" width="32" height="32" alt="Facebook"><img align="absmiddle" src="assets/profile/icons/facebook-label.svg" height="32" alt="Facebook"></a><br>
<a href="https://github.com/alyyyyyanna"><img align="absmiddle" src="assets/profile/icons/github.svg" width="32" height="32" alt="GitHub"><img align="absmiddle" src="assets/profile/icons/github-label.svg" height="32" alt="Github"></a><br>
<a href="www.linkedin.com/in/alyanna-miñoza-30818a345"><img align="absmiddle" src="assets/profile/icons/linkedin.svg" width="32" height="32" alt="LinkedIn"><img align="absmiddle" src="assets/profile/icons/linkedin-label.svg" height="32" alt="LinkedIn"></a>
</td>
<td width="63%" valign="top">
<img src="assets/profile/header-words.svg" alt="Alyanna Marie Minoza. " width="100%">
</td>
</tr>
</table>
    <div class="gap"></div>
    <img src="assets/profile/tagline.svg" alt="" width="100%">
    <img src="assets/profile/stack-field.svg" alt="" width="100%">
    <img src="assets/profile/projects-label.svg" alt="" width="100%">
    <img src="assets/profile/cards/Olympus Mons.svg" alt="" width="100%">
    <img src="assets/profile/cards/grid9ora.svg" alt="" width="100%">
    <img src="assets/profile/cards/Space Traveler.svg" alt="" width="100%">
    <table>
      <tr>
        <td width="58%"><img src="assets/profile/activity.svg" alt="" width="100%"></td>
        <td width="42%"><img src="assets/profile/quote.svg" alt="" width="100%"></td>
      </tr>
    </table>
  </main>
</body>
</html>
